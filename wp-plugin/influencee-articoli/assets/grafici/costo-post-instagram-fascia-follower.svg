<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Quanto costa un post Instagram in Italia</title><desc id="d">Costo medio di un post per fascia di follower</desc>
<defs><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffe3f1"/><line x1="0" y1="0" x2="0" y2="10" stroke="#e6007e" stroke-width="4"/></pattern></defs>
<rect width="1200" height="675" fill="#fff"/>
<text x="120" y="62" font-family="Montserrat,Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0b0b0c">Quanto costa un post Instagram in Italia</text>
<text x="120" y="100" font-family="Inter,Arial,sans-serif" font-size="20" fill="#6b6b6b">Costo medio di un post per fascia di follower</text>
<line x1="120" y1="525" x2="1140" y2="525" stroke="#d9d9d9" stroke-width="2"/>
<rect x="157" y="522" width="131" height="3" rx="10" fill="#c8ff1a"/>
<text x="222" y="508" text-anchor="middle" font-family="Montserrat,Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#0b0b0c">200 €</text>
<text x="222" y="561" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#0b0b0c">Nano 1–10k</text>
<text x="222" y="589" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#6b6b6b">DeRev</text>
<rect x="361" y="510" width="131" height="15" rx="10" fill="#0b0b0c"/>
<text x="426" y="496" text-anchor="middle" font-family="Montserrat,Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#0b0b0c">950 €</text>
<text x="426" y="561" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#0b0b0c">Micro 10–50k</text>
<text x="426" y="589" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#6b6b6b">DeRev</text>
<rect x="565" y="469" width="131" height="56" rx="10" fill="#0b0b0c"/>
<text x="630" y="455" text-anchor="middle" font-family="Montserrat,Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#0b0b0c">3.550 €</text>
<text x="630" y="561" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#0b0b0c">Mid 50–250k</text>
<text x="630" y="589" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#6b6b6b">DeRev</text>
<rect x="769" y="399" width="131" height="126" rx="10" fill="url(#h)"/>
<text x="834" y="385" text-anchor="middle" font-family="Montserrat,Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#0b0b0c">8.000 €</text>
<text x="834" y="561" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#0b0b0c">Macro 250k–1M</text>
<text x="834" y="589" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#6b6b6b">stima</text>
<rect x="973" y="150" width="131" height="375" rx="10" fill="#0b0b0c"/>
<text x="1038" y="136" text-anchor="middle" font-family="Montserrat,Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#0b0b0c">23.750 €</text>
<text x="1038" y="561" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#0b0b0c">Mega 1M+</text>
<text x="1038" y="589" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#6b6b6b">DeRev</text>
<text x="120" y="647" font-family="Inter,Arial,sans-serif" font-size="17" fill="#6b6b6b">Barra tratteggiata: stima, non un dato pubblicato. Valori indicativi, il compenso si concorda caso per caso.</text>
<text x="1140" y="647" text-anchor="end" font-family="Montserrat,Arial,sans-serif" font-size="20" font-weight="800" fill="#0b0b0c">influencee.it</text></svg>